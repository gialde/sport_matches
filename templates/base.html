{% load static %}<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Спортивные матчи{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a class="brand" href="{% url 'home' %}">
            <img class="logo" src="{% static 'img/logo.png' %}" alt="Логотип">
            <span class="brand-name">Спортивные матчи</span>
        </a>
        {% with current=request.resolver_match.url_name %}
        <nav class="main-nav">
            <ul class="nav-list">
                <li><a href="{% url 'home' %}"{% if current == 'home' %} class="active"{% endif %}>Главная</a></li>
                <li><a href="{% url 'court_list' %}"{% if current == 'court_list' %} class="active"{% endif %}>Площадки</a></li>
                <li><a href="{% url 'match_list' %}"{% if current == 'match_list' or current == 'match_detail' %} class="active"{% endif %}>Матчи</a></li>
                <li><a href="{% url 'statistics' %}"{% if current == 'statistics' %} class="active"{% endif %}>Статистика</a></li>
            </ul>
        </nav>
        {% endwith %}
    </div>
</header>
<main class="container page-content">
    {% block content %}{% endblock %}
</main>
<footer class="site-footer"><div class="container">Учебный проект на Django и SQLite, {% now "Y" %}</div></footer>
<script src="{% static 'js/main.js' %}"></script>
</body>
</html>
